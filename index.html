<!DOCTYPE html>
<html>
<head>
  <title>Custom Cookie Boxes</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background-color: #fff7f0;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #d2691e;
      color: white;
      padding: 20px;
    }
    .box {
      margin: 20px;
      padding: 20px;
      border: 2px solid #d2691e;
      display: inline-block;
      border-radius: 10px;
      background: white;
    }
    button {
      background-color: #d2691e;
      color: white;
      border: none;
      padding: 10px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>🍪 Custom Cookie Boxes</h1>
  <p>Fresh baked cookies made to order</p>
</header>

<div class="box">
  <h2>Small Box</h2>
  <p>12 cookies – £10</p>
</div>

<div class="box">
  <h2>Medium Box</h2>
  <p>24 cookies – £18</p>
</div>

<div class="box">
  <h2>Custom Box</h2>
  <p>Pick your flavours & message</p>
</div>

<br><br>

<h3>How to order</h3>
<p>Message us on Instagram or email to place your order</p>

<button onclick="alert('Order form coming soon!')">Order Now</button>

</body>
</html>
