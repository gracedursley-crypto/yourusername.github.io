<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Cookie Bakery</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f6f1e7; /* beige */
      color: #2f2f2f;
    }

    header {
      background-color: #d8e2dc; /* soft green */
      padding: 60px 20px;
      text-align: center;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      margin: 0;
      color: #3a3a3a;
    }

    header p {
      margin-top: 10px;
      font-size: 16px;
      color: #4a4a4a;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
      text-align: center;
    }

    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      margin-bottom: 20px;
    }

    .boxes {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .box {
      background: #ffffff;
      border-radius: 16px;
      padding: 25px;
      width: 250px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      border-top: 4px solid #b7cbbf; /* green accent */
    }

    .box h3 {
      font-family: 'Playfair Display', serif;
      margin-bottom: 10px;
    }

    .box p {
      font-size: 14px;
      color: #555;
    }

    .btn {
      margin-top: 30px;
      background-color: #b7cbbf;
      color: #2f2f2f;
      padding: 12px 20px;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-size: 14px;
      transition: 0.3s;
    }

    .btn:hover {
      background-color: #9fb7a8;
    }

    footer {
      margin-top: 60px;
      padding: 30px;
      text-align: center;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>

<header>
  <h1>Sweet Meadow Bakery</h1>
  <p>Handcrafted custom cookie boxes made fresh to order</p>
</header>

<div class="container">

  <div class="section-title">Our Cookie Boxes</div>

  <div class="boxes">

    <div class="box">
      <h3>Small Box</h3>
      <p>12 artisan cookies<br>Perfect gift size</p>
    </div>

    <div class="box">
      <h3>Medium Box</h3>
      <p>24 cookies<br>Best for sharing</p>
    </div>

    <div class="box">
      <h3>Custom Box</h3>
      <p>Choose flavours, colours & message</p>
    </div>

  </div>

  <button class="btn">Order via Instagram</button>

</div>

<footer>
  © 2026 Sweet Meadow Bakery · Handmade with love
</footer>

</body>
</html>
